[project]
name = "ai-job-intelligence"
version = "0.1.0"
description = "Production-grade AI Job Intelligence & Ingestion Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.3",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4,<4.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "python-jobspy>=1.1.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
